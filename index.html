<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basbosa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #ff9ac7 0%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff6b6b;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            height: 60px;
        }

        button {
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background: #e0079b;
            color: white;
        }

        .yes-btn:hover {
            background: #ee5a5a;
            transform: scale(1.1);
        }

        .no-btn {
            background: #f80303;
            color: rgb(255, 255, 255);
        }

        .no-btn:hover {
            background: #a0a0a0;
        }

        .hidden {
            display: none;
        }

        .celebration {
            text-align: center;
        }

        .celebration h1 {
            font-size: 40px;
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        .heart {
            font-size: 100px;
            animation: beat 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- الصفحة الأولى -->
    <div class="box" id="questionPage">
        <h1>تتصالح ياعم الادمن؟❤️</h1>
        <div class="buttons">
            <button class="no-btn" onmouseover="moveButton()" onclick="moveButton()">لا</button>
            <button class="yes-btn" onclick="showCelebration()">نعم</button>
        </div>
    </div>

    <!-- صفحة الاحتفال -->
    <div class="box hidden" id="celebrationPage">
        <div class="heart">❤️</div>
        <h1>قال مش بعرف اصالحك قال! 🎉</h1>
        <p style="font-size: 20px; color: #666;">متزعليش يا بسابيسو انا بحبك انا هفضل كل مره اجيلك ❤️</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.querySelector('.no-btn');
            const randomX = Math.random() * 200 - 100;
            const randomY = Math.random() * 200 - 100;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function showCelebration() {
            document.getElementById('questionPage').classList.add('hidden');
            document.getElementById('celebrationPage').classList.remove('hidden');
        }
    </script>
</body>
</html>
